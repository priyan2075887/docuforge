version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - web
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - api
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 10
