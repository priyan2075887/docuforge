name: Feature request
description: Propose an improvement to DocuForge
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Explain the user problem before the implementation. Broad architecture changes, new remote services, and OCR/model integrations need explicit privacy, maintenance, and licensing consideration.

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - PDF viewing or analysis
        - PDF editing or page tools
        - OCR or document understanding
        - Writer or document interoperability
        - Spreadsheet or workbook interoperability
        - Presentations or slide interoperability
        - Document library or storage
        - FastAPI backend
        - Desktop or deployment
        - Accessibility or keyboard interaction
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who has this problem, and what can they not do today?
      placeholder: When I ..., I need ..., because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the desired workflow or behavior without assuming a particular library.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows, open-source projects, or simpler approaches you evaluated.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that would make the feature complete.
      placeholder: |
        - Users can ...
        - The original document remains ...
        - Keyboard users can ...

  - type: textarea
    id: implications
    attributes:
      label: Privacy, compatibility, and licensing
      description: Describe network access, file-format effects, new dependencies, and model or weight licenses. Write "No known impact" only after considering each area.
      placeholder: |
        - Local or network processing:
        - Document interoperability or data-loss risk:
        - Proposed dependencies and licenses:
        - Model implementation and weight licenses:

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches, links, or synthetic examples. Do not attach confidential documents or copy proprietary assets.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and the current documented milestones.
          required: true
        - label: I have not included private documents, proprietary assets, or secrets.
          required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this feature.
          required: false
